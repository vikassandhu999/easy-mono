<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1565" viewBox="0 0 1600 1565"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3f8b73"/></marker></defs><rect width="1600" height="1565" fill="#f7f8f3"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="52" font-size="14" font-weight="700" letter-spacing="2" fill="#0d6658">EASY / CHECK-INS LIFECYCLE REPORT</text><text x="60" y="112" font-size="46" font-weight="700" letter-spacing="-1" fill="#192e30">The whole coaching lifecycle</text><text x="60" y="153" font-size="21" fill="#5f7273">Read top to bottom. Stages 3–6 repeat throughout coaching. Amber marks unresolved rules.</text><rect x="1260" y="36" width="280" height="38" rx="19" fill="#fff0d4"/><text x="1400" y="61" text-anchor="middle" font-size="15" font-weight="700" fill="#8c510a">PROPOSAL · 03 OCT 2026</text><text x="82" y="208" font-size="13" font-weight="700" letter-spacing="1.5" fill="#698178">STAGE</text><text x="350" y="208" font-size="13" font-weight="700" letter-spacing="1.5" fill="#698178">CLIENT</text><text x="750" y="208" font-size="13" font-weight="700" letter-spacing="1.5" fill="#698178">COACH</text><text x="1150" y="208" font-size="13" font-weight="700" letter-spacing="1.5" fill="#698178">WHAT PERSISTS / WHAT IS OPEN</text><rect x="60" y="228" width="1480" height="148" rx="13" fill="#fff" stroke="#dbe5df"/><rect x="60" y="228" width="255" height="148" rx="13" fill="#edf1eb"/><text x="82" y="258" font-size="14" font-weight="700" fill="#52766a">01</text><text x="82" y="291" font-size="25" fill="#192e30" font-weight="700"><tspan x="82" dy="0">Start coaching</tspan></text><rect x="80" y="338" width="215" height="23" rx="5" fill="#fff0d4"/><text x="91" y="354" font-size="11.5" font-weight="700" fill="#8c510a">OPEN · PV2</text><text x="350" y="261" font-size="20" fill="#3f5753" font-weight="400"><tspan x="350" dy="0">Accept the invitation. Wait if</tspan><tspan x="350" dy="29">coaching cannot start yet.</tspan></text><text x="750" y="261" font-size="20" fill="#3f5753" font-weight="400"><tspan x="750" dy="0">Prepare plans. Client appears as</tspan><tspan x="750" dy="29">soon as coaching is active.</tspan></text><text x="1150" y="261" font-size="19" fill="#3f5753" font-weight="400"><tspan x="1150" dy="0">One model must own the start/end</tspan><tspan x="1150" dy="29">boundary: current lifecycle or</tspan><tspan x="1150" dy="29">Engagement.</tspan></text><path d="M188 377 L188 388" stroke="#91a79d" stroke-width="2"/><rect x="60" y="390" width="1480" height="148" rx="13" fill="#fff" stroke="#dbe5df"/><rect x="60" y="390" width="255" height="148" rx="13" fill="#edf1eb"/><text x="82" y="420" font-size="14" font-weight="700" fill="#52766a">02</text><text x="82" y="453" font-size="25" fill="#192e30" font-weight="700"><tspan x="82" dy="0">Set guidance</tspan></text><rect x="80" y="500" width="215" height="23" rx="5" fill="#e2ebf5"/><text x="91" y="516" font-size="11.5" font-weight="700" fill="#315f94">PROPOSED</text><text x="350" y="423" font-size="20" fill="#3f5753" font-weight="400"><tspan x="350" dy="0">See training, nutrition, and</tspan><tspan x="350" dy="29">assigned trackers.</tspan></text><text x="750" y="423" font-size="20" fill="#3f5753" font-weight="400"><tspan x="750" dy="0">Choose weekday and 1-, 2-, or</tspan><tspan x="750" dy="29">4-week cadence. Set the current</tspan><tspan x="750" dy="29">focus.</tspan></text><text x="1150" y="423" font-size="19" fill="#3f5753" font-weight="400"><tspan x="1150" dy="0">First attention uses the</tspan><tspan x="1150" dy="29">selected weekday on or after</tspan><tspan x="1150" dy="29">start. No minimum wait.</tspan></text><path d="M188 539 L188 550" stroke="#91a79d" stroke-width="2"/><rect x="60" y="552" width="1480" height="148" rx="13" fill="#fff" stroke="#dbe5df"/><rect x="60" y="552" width="255" height="148" rx="13" fill="#e9f1e8"/><text x="82" y="582" font-size="14" font-weight="700" fill="#52766a">03</text><text x="82" y="615" font-size="25" fill="#192e30" font-weight="700"><tspan x="82" dy="0">Record</tspan></text><rect x="80" y="662" width="215" height="23" rx="5" fill="#e2ebf5"/><text x="91" y="678" font-size="11.5" font-weight="700" fill="#315f94">ONGOING</text><text x="350" y="585" font-size="20" fill="#3f5753" font-weight="400"><tspan x="350" dy="0">Record workouts, meals,</tspan><tspan x="350" dy="29">Reflection, and grouped PDF/image</tspan><tspan x="350" dy="29">reports.</tspan></text><text x="750" y="585" font-size="20" fill="#3f5753" font-weight="400"><tspan x="750" dy="0">Inspect ongoing activity. Add</tspan><tspan x="750" dy="29">tracker entries with coach</tspan><tspan x="750" dy="29">attribution.</tspan></text><text x="1150" y="585" font-size="19" fill="#3f5753" font-weight="400"><tspan x="1150" dy="0">Dated facts persist. Historical</tspan><tspan x="1150" dy="29">expectations and nutrition rules</tspan><tspan x="1150" dy="29">need work (PV5–6).</tspan></text><path d="M188 701 L188 712" stroke="#91a79d" stroke-width="2"/><rect x="60" y="714" width="1480" height="148" rx="13" fill="#fff" stroke="#dbe5df"/><rect x="60" y="714" width="255" height="148" rx="13" fill="#e9f1e8"/><text x="82" y="744" font-size="14" font-weight="700" fill="#52766a">04</text><text x="82" y="777" font-size="25" fill="#192e30" font-weight="700"><tspan x="82" dy="0">Notice</tspan></text><rect x="80" y="824" width="215" height="23" rx="5" fill="#fff0d4"/><text x="91" y="840" font-size="11.5" font-weight="700" fill="#8c510a">OPEN · PV1</text><text x="350" y="747" font-size="20" fill="#3f5753" font-weight="400"><tspan x="350" dy="0">Keep recording. Use chat for</tspan><tspan x="350" dy="29">anything urgent.</tspan></text><text x="750" y="747" font-size="20" fill="#3f5753" font-weight="400"><tspan x="750" dy="0">See every client, last review,</tspan><tspan x="750" dy="29">schedule, new information, and</tspan><tspan x="750" dy="29">unread chat.</tspan></text><text x="1150" y="747" font-size="19" fill="#3f5753" font-weight="400"><tspan x="1150" dy="0">The calendar stays fixed.</tspan><tspan x="1150" dy="29">Early-review reminder handling</tspan><tspan x="1150" dy="29">is still unresolved.</tspan></text><path d="M188 863 L188 874" stroke="#91a79d" stroke-width="2"/><rect x="60" y="876" width="1480" height="148" rx="13" fill="#fff" stroke="#dbe5df"/><rect x="60" y="876" width="255" height="148" rx="13" fill="#e9f1e8"/><text x="82" y="906" font-size="14" font-weight="700" fill="#52766a">05</text><text x="82" y="939" font-size="25" fill="#192e30" font-weight="700"><tspan x="82" dy="0">Review</tspan></text><rect x="80" y="986" width="215" height="23" rx="5" fill="#e2ebf5"/><text x="91" y="1002" font-size="11.5" font-weight="700" fill="#315f94">PROPOSED · PV4</text><text x="350" y="909" font-size="20" fill="#3f5753" font-weight="400"><tspan x="350" dy="0">See an actual review in history</tspan><tspan x="350" dy="29">and any optional reply.</tspan></text><text x="750" y="909" font-size="20" fill="#3f5753" font-weight="400"><tspan x="750" dy="0">Inspect evidence. Set private</tspan><tspan x="750" dy="29">assessment. Add optional</tspan><tspan x="750" dy="29">note/reply. Complete review.</tspan></text><text x="1150" y="909" font-size="19" fill="#3f5753" font-weight="400"><tspan x="1150" dy="0">Save what was considered. Later</tspan><tspan x="1150" dy="29">or unseen changes stay new.</tspan><tspan x="1150" dy="29">Date-range rule: PV7.</tspan></text><path d="M188 1025 L188 1036" stroke="#91a79d" stroke-width="2"/><rect x="60" y="1038" width="1480" height="148" rx="13" fill="#fff" stroke="#dbe5df"/><rect x="60" y="1038" width="255" height="148" rx="13" fill="#e9f1e8"/><text x="82" y="1068" font-size="14" font-weight="700" fill="#52766a">06</text><text x="82" y="1101" font-size="25" fill="#192e30" font-weight="700"><tspan x="82" dy="0">Guide &amp; repeat</tspan></text><rect x="80" y="1148" width="215" height="23" rx="5" fill="#fff0d4"/><text x="91" y="1164" font-size="11.5" font-weight="700" fill="#8c510a">OPEN · PV3</text><text x="350" y="1071" font-size="20" fill="#3f5753" font-weight="400"><tspan x="350" dy="0">Follow current focus. Supply</tspan><tspan x="350" dy="29">requested tracker information.</tspan></text><text x="750" y="1071" font-size="20" fill="#3f5753" font-weight="400"><tspan x="750" dy="0">Update focus and eligible plan</tspan><tspan x="750" dy="29">guidance. Issue dated requests.</tspan></text><text x="1150" y="1071" font-size="19" fill="#3f5753" font-weight="400"><tspan x="1150" dy="0">Focus lasts until changed.</tspan><tspan x="1150" dy="29">Request deadline, late receipt,</tspan><tspan x="1150" dy="29">and reopening need rules.</tspan></text><path d="M188 1187 L188 1198" stroke="#91a79d" stroke-width="2"/><rect x="60" y="1200" width="1480" height="148" rx="13" fill="#fff" stroke="#dbe5df"/><rect x="60" y="1200" width="255" height="148" rx="13" fill="#edf1eb"/><text x="82" y="1230" font-size="14" font-weight="700" fill="#52766a">07</text><text x="82" y="1263" font-size="25" fill="#192e30" font-weight="700"><tspan x="82" dy="0">End / return</tspan></text><rect x="80" y="1310" width="215" height="23" rx="5" fill="#fff0d4"/><text x="91" y="1326" font-size="11.5" font-weight="700" fill="#8c510a">CONDITIONAL · PV2</text><text x="350" y="1233" font-size="20" fill="#3f5753" font-weight="400"><tspan x="350" dy="0">Under Engagement: retain read-only</tspan><tspan x="350" dy="29">history. Record again when</tspan><tspan x="350" dy="29">coaching resumes.</tspan></text><text x="750" y="1233" font-size="20" fill="#3f5753" font-weight="400"><tspan x="750" dy="0">Stop attention when coaching ends.</tspan><tspan x="750" dy="29">Resume from a new eligible start.</tspan></text><text x="1150" y="1233" font-size="19" fill="#3f5753" font-weight="400"><tspan x="1150" dy="0">Retain records and reviews.</tspan><tspan x="1150" dy="29">Define what happens to old</tspan><tspan x="1150" dy="29">focus, requests, and baselines.</tspan></text><path d="M48 1113 H25 V626 H45" fill="none" stroke="#3f8b73" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1380" width="1480" height="61" rx="12" fill="#0d6658"/><text x="86" y="1417" font-size="22" font-weight="700" fill="#fff">Continuous history</text><text x="333" y="1417" font-size="21" fill="#d5e9e0">Workouts · Meals · Tracker entries · Guidance · Actual reviews</text><text x="60" y="1480" font-size="18" fill="#5f7273">Calendar dates guide attention. Review dates record actual coaching work. Reporting ranges organize comparisons.</text><text x="60" y="1520" font-size="15" fill="#7c8d86">Visual report of the proposal and validation findings. Engagement behavior is conditional; unresolved choices remain unapproved.</text></g></svg>
